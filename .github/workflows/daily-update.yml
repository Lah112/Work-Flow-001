name: Daily Repository Update

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          echo "# Automatic Repository Update" > LAST_UPDATED.md
          echo "" >> LAST_UPDATED.md
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> LAST_UPDATED.md

      - name: Commit changes
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          git add LAST_UPDATED.md

          git diff --cached --quiet || git commit -m "chore: automatic daily update"

          git push
